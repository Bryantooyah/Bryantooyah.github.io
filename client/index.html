    <!--
      Applies the saved theme before first paint. Inline and synchronous on
      purpose: deferring this to React would let the browser paint the default
      theme first, producing a white flash for dark-mode visitors on every load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* Private mode or blocked storage — fall through to the light theme. */
        }
      })();
    </script>
